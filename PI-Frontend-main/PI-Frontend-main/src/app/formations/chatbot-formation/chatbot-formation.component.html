<div class="chatbot-wrapper">

  <button class="chatbot-toggle" (click)="toggleChat()" [class.open]="isOpen" type="button" title="Assistant IA">
    <i class="ri-robot-line" *ngIf="!isOpen"></i>
    <i class="ri-close-line" *ngIf="isOpen"></i>
    <span class="chatbot-badge" *ngIf="!isOpen">IA</span>
  </button>

  <div class="chatbot-panel" [class.open]="isOpen">

    <div class="chatbot-header">
      <div class="chatbot-header-info">
        <div class="chatbot-avatar">
          <i class="ri-robot-line"></i>
        </div>
        <div>
          <div class="chatbot-name">Assistant IA</div>
          <div class="chatbot-subtitle" *ngIf="sessions.length === 0 || !currentSessionId">
            {{ formation?.titre | slice:0:30 }}...
          </div>
          <div class="chatbot-session-selector" *ngIf="sessions.length > 0">
            <ng-container *ngIf="!isRenamingSession">
              <select (change)="selectSession($event)" [ngModel]="currentSessionId || ''">
                <option value="">+ Nouvelle discussion</option>
                <optgroup label="Historique des discussions">
                  <ng-container *ngFor="let s of sessions">
                    <option *ngIf="s.sessionTitle" [value]="s.sessionId">
                      {{ s.sessionTitle }}
                    </option>
                  </ng-container>
                </optgroup>
              </select>
              <button class="rename-session-btn" (click)="startRenaming()" title="Renommer">
                <i class="ri-edit-line"></i>
              </button>
              <button type="button" class="rename-session-btn del-session"
                *ngIf="currentSessionId" (click)="deleteCurrentSession()"
                title="Supprimer la discussion">
                <i class="ri-delete-bin-line"></i>
              </button>
            </ng-container>
            <ng-container *ngIf="isRenamingSession">
              <input type="text" [(ngModel)]="newSessionTitle" class="rename-input"
                (keyup.enter)="saveRenamedSession()">
              <button class="rename-action-btn ok" (click)="saveRenamedSession()">
                <i class="ri-check-line"></i>
              </button>
              <button class="rename-action-btn cancel" (click)="cancelRenaming()">
                <i class="ri-close-line"></i>
              </button>
            </ng-container>
          </div>
        </div>
      </div>

      <div class="chatbot-header-actions">
        <button *ngIf="isSpeaking" (click)="stopSpeaking()" type="button"
          class="chatbot-action-btn speaking-btn" title="Arrêter la lecture">
          <i class="ri-stop-circle-line"></i>
        </button>
        <button *ngIf="isTTSSupported" (click)="toggleVoice()" type="button"
          class="chatbot-action-btn"
          [class.voice-active]="voiceEnabled"
          [title]="voiceEnabled ? 'Désactiver la lecture vocale automatique' : 'Activer la lecture vocale automatique'">
          <i [class]="voiceEnabled ? 'ri-volume-up-line' : 'ri-volume-mute-line'"></i>
        </button>
        <button (click)="closeChat()" title="Fermer" type="button" class="chatbot-action-btn">
          <i class="ri-close-line"></i>
        </button>
      </div>
    </div>

    <div class="chatbot-messages" #messagesContainer>
      <div class="chat-message" *ngFor="let msg of messages; let i = index"
        [class.user]="msg.role === 'user'"
        [class.assistant]="msg.role === 'assistant'">

        <div class="msg-avatar" *ngIf="msg.role === 'assistant'">
          <i class="ri-robot-line"></i>
        </div>

        <div class="msg-bubble">

          <div class="msg-loading" *ngIf="msg.loading">
            <span></span><span></span><span></span>
          </div>

          <img class="chat-img-bubble" *ngIf="msg.imageUrl && !msg.imageUrl.startsWith('[image:')"
            [src]="msg.imageUrl" alt="User upload" />

          <div class="chat-file-bubble" *ngIf="msg.imageUrl && msg.imageUrl.startsWith('[image:')">
            <i class="ri-image-line"></i>
            <span>Image jointe</span>
          </div>

          <div class="chat-file-bubble" *ngIf="msg.fileName && !msg.imageUrl">
            <i [class]="getFileIcon(msg.fileName)"></i>
            <div class="chat-file-info">
              <span class="chat-file-name">{{ msg.fileName }}</span>
              <span class="chat-file-excerpt" *ngIf="msg.fileExcerpt && !msg.fileExcerpt.startsWith('[file:')">
                {{ msg.fileExcerpt }}
              </span>
            </div>
          </div>

          <div class="msg-content" *ngIf="!msg.loading && !msg.isEditing"
            [innerHTML]="formatMessage(msg.content)">
          </div>

          <div class="msg-edit-mode" *ngIf="msg.isEditing">
            <textarea [(ngModel)]="msg.editContent" rows="3" class="edit-textarea"></textarea>
            <div class="edit-actions">
              <button class="btn-save" (click)="saveEditMessage(i, msg)">Enregistrer et Envoyer</button>
              <button class="btn-cancel" (click)="cancelEditMessage(msg)">Annuler</button>
            </div>
          </div>

          <div class="msg-hover-actions" *ngIf="!msg.loading && !msg.isEditing">
            <button title="Copier" (click)="copyMessage(msg)">
              <i class="ri-clipboard-line"></i>
            </button>
            <button *ngIf="msg.role === 'assistant' && isTTSSupported"
              [title]="isSpeaking ? 'Arrêter la lecture' : 'Lire à voix haute'"
              (click)="isSpeaking ? stopSpeaking() : speakMessage(msg.content)"
              [class.tts-active]="isSpeaking">
              <i [class]="isSpeaking ? 'ri-stop-circle-line' : 'ri-volume-up-line'"></i>
            </button>
            <button *ngIf="msg.role === 'user'" title="Modifier" (click)="startEditMessage(msg)">
              <i class="ri-edit-line"></i>
            </button>
            <button *ngIf="msg.role === 'user'" title="Supprimer" (click)="deleteMessage(i)" class="del-btn">
              <i class="ri-delete-bin-line"></i>
            </button>
          </div>
        </div>

        <div class="msg-avatar user-avatar" *ngIf="msg.role === 'user'">
          <i class="ri-user-line"></i>
        </div>
      </div>
    </div>

    <div class="chatbot-suggestions" *ngIf="messages.length <= 1">
      <button *ngFor="let s of quickSuggestions" class="suggestion-chip"
        (click)="sendMessage(s)" type="button">
        {{ s }}
      </button>
    </div>

    <div class="chatbot-image-preview" *ngIf="selectedImageBase64">
      <div class="preview-container">
        <img [src]="selectedImageBase64" alt="Preview"/>
        <button class="remove-preview-btn" (click)="removeSelectedImage()" type="button">
          <i class="ri-close-circle-fill"></i>
        </button>
      </div>
    </div>

    <div class="chatbot-file-preview" *ngIf="selectedFileName && !selectedImageBase64">
      <div class="file-preview-container">
        <i [class]="getFileIcon(selectedFileName)" class="file-preview-icon"></i>
        <div class="file-preview-info">
          <span class="file-preview-name">{{ selectedFileName }}</span>
          <span class="file-preview-status" *ngIf="selectedFileText">
            <i class="ri-check-line"></i> Texte extrait ({{ selectedFileText.length }} caractères)
          </span>
          <span class="file-preview-status pending" *ngIf="!selectedFileText">
            <i class="ri-time-line"></i> Prêt à envoyer
          </span>
        </div>
        <button class="remove-preview-btn" (click)="removeSelectedFile()" type="button">
          <i class="ri-close-circle-fill"></i>
        </button>
      </div>
    </div>

    <div class="voice-listening-bar" *ngIf="isListening">
      <div class="listening-waves">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <span class="listening-label">Je vous écoute...</span>
      <button class="stop-listening-btn" (click)="stopListening()" type="button">
        <i class="ri-stop-line"></i>
      </button>
    </div>

    <div class="chatbot-input-area">

      <input type="file" #imageInput id="image-upload" accept="image/*"
        (change)="onImageSelected($event)" style="display: none;">

      <input type="file" #docInput id="doc-upload" [accept]="ACCEPTED_FILE_TYPES"
        (change)="onDocumentSelected($event)" style="display: none;">

      <div class="chatbot-upload-group">
        <button class="chatbot-upload-btn" type="button"
          (click)="showUploadOptions = !showUploadOptions"
          [class.active]="showUploadOptions"
          title="Joindre une image ou un document">
          <i class="ri-upload-cloud-line"></i>
        </button>
        <div class="upload-options" *ngIf="showUploadOptions">
          <button class="upload-option-btn" type="button"
            (click)="showUploadOptions = false; imageInput.click();">
            <i class="ri-image-add-line"></i>
            <span>Image</span>
          </button>
          <button class="upload-option-btn" type="button"
            (click)="showUploadOptions = false; docInput.click();">
            <i class="ri-file-add-line"></i>
            <span>Document</span>
          </button>
        </div>
      </div>


      <button *ngIf="isSpeechSupported"
        class="chatbot-mic-btn"
        [class.listening]="isListening"
        (click)="startListening()"
        [title]="isListening ? 'Arrêter l\'écoute' : 'Parler (reconnaissance vocale)'"
        [disabled]="isLoading"
        type="button">
        <i [class]="isListening ? 'ri-mic-off-line' : 'ri-mic-line'"></i>
      </button>

      <textarea id="chatbot-input" class="chatbot-textarea"
        [(ngModel)]="inputText"
        (keydown)="onEnterKey($event)"
        [placeholder]="isListening ? 'Parlez maintenant...' : selectedFileName ? 'Posez votre question sur ce document...' : 'Posez votre question...'"
        rows="1"
        [disabled]="isLoading">
      </textarea>

      <button class="chatbot-send"
        (click)="sendMessage()"
        [disabled]="(!inputText.trim() && !selectedImageBase64 && !selectedFileName) || isLoading"
        type="button">
        <i class="ri-send-plane-fill" *ngIf="!isLoading"></i>
        <i class="ri-loader-4-line spin" *ngIf="isLoading"></i>
      </button>
    </div>

    <div class="chatbot-footer">
      Powered by IA 
    </div>

  </div>
</div>
