<!-- Page Banner -->
<div class="page-banner-area">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-lg-8 col-md-12">
                <h1>Modifier l'Événement</h1>
            </div>
            <div class="col-lg-4 col-md-12">
                <ul class="ps-0 mb-0 list-unstyled">
                    <li class="d-inline-block position-relative">
                        <a routerLink="/">Accueil</a>
                    </li>
                    <li class="d-inline-block position-relative">
                        <a routerLink="/evenements">Événements</a>
                    </li>
                    <li class="d-inline-block position-relative">
                        Modifier
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>

<!-- Edit Form Area -->
<div class="evenement-form-area ptb-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-12">

                <!-- Succès -->
                <div class="alert alert-success" *ngIf="success">
                    <i class="ri-check-line"></i> Événement modifié avec succès !
                </div>

                <!-- Erreur -->
                <div class="alert alert-danger" *ngIf="error">
                    <i class="ri-close-line"></i> Erreur lors de la modification !
                </div>

                <div class="form-box">
                    <div class="form-box-header">
                        <h3>Informations de l'événement</h3>
                        <p>Modifiez les champs souhaités puis enregistrez.</p>
                    </div>

                    <form #f="ngForm" (ngSubmit)="modifier(f)">
                        <div class="row">

                            <!-- Titre -->
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">Titre</label>
                                    <input
                                        type="text"
                                        class="form-control"
                                        name="titre"
                                        [(ngModel)]="evenement.titre"
                                        required
                                    >
                                </div>
                            </div>

                            <!-- Date -->
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label class="form-label">Date et heure</label>
                                        <input
                                            type="datetime-local"
                                            class="form-control"
                                            name="dateHeure"
                                            [(ngModel)]="evenement.dateHeure"
                                            required
                                        >
                                    </div>
                                </div>

                            <!-- Lieu -->
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">Lieu</label>
                                    <input
                                        type="text"
                                        class="form-control"
                                        name="lieu"
                                        [(ngModel)]="evenement.lieu"
                                        required
                                    >
                                </div>
                            </div>

                            <!-- Type -->
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">Type</label>
                                    <select
                                        class="form-control"
                                        name="type"
                                        [(ngModel)]="evenement.type"
                                        required
                                    >
                                        <option value="">Choisir un type</option>
                                        <option value="JOB_FAIR">Job Fair</option>
                                        <option value="WORKSHOP">Workshop</option>
                                        <option value="CONFERENCE">Conférence</option>
                                        <option value="NETWORKING">Networking</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Boutons -->
                            <div class="col-md-12">
                                <div class="form-btns d-flex align-items-center gap-3">
                                    <button type="submit" class="default-btn">
                                        <i class="ri-check-line"></i> Modifier
                                    </button>
                                    <button type="button" class="default-btn outline-btn" (click)="annuler()">
                                        <i class="ri-close-line"></i> Annuler
                                    </button>
                                </div>
                            </div>

                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>
