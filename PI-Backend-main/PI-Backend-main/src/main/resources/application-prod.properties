# Production profile — activate with: spring.profiles.active=prod
# All secrets must come from environment variables or mounted secrets (e.g. Key Vault CSI).

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

# Fail fast if JWT not provided (overrides dev default from application.properties)
jwt.secret=${JWT_SECRET}

# Stricter JDBC — enable TLS to MySQL in real deployments (set full JDBC URL via DB_URL)
# Example: jdbc:mysql://host:3306/db?useSSL=true&requireSSL=true&serverTimezone=UTC

logging.level.root=INFO

# Set FLYWAY_ENABLED=true when you ship real migrations under classpath:db/migration
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
