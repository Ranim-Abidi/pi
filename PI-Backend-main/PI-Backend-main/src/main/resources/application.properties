spring.application.name=jobmatch

# Active profile: use "dev" for local defaults (see application-dev.properties). Production: unset or use "prod".
# spring.profiles.active=dev

# ===== DATABASE (override via env / ConfigMap / Key Vault CSI) =====
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/jobmatch_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=CONVERT_TO_NULL}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# ===== SERVER =====
server.port=${SERVER_PORT:8080}

# ===== FILE UPLOAD LIMITS =====
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

server.tomcat.max-http-request-size=52428800
server.tomcat.max-connector-wait-timeout-ms=52428800

# ===== LOGGING =====
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}
logging.level.org.hibernate=${LOG_LEVEL_HIBERNATE:WARN}

# ===== JWT — set JWT_SECRET in prod; default below is for local dev only =====
jwt.secret=${JWT_SECRET:dev_only_change_me_min_32_characters_long!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ===== Optional external APIs (Chatbot Groq, YouTube, etc.) =====
groq.api.key=${GROQ_API_KEY:}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
youtube.api.key=${YOUTUBE_API_KEY:}
google.search.api.key=${GOOGLE_SEARCH_API_KEY:}
google.search.cx=${GOOGLE_SEARCH_CX:}
gemini.api.key=${GEMINI_API_KEY:}
huggingface.api.key=${HUGGINGFACE_API_KEY:}
replicate.api.key=${REPLICATE_API_KEY:}
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.api.url=${ANTHROPIC_API_URL:https://api.anthropic.com/v1/messages}

# ===== EMAIL =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== App URLs =====
app.certificates.storage-path=${APP_CERTIFICATES_STORAGE_PATH:./certificates}
app.certificates.base-url=${APP_CERTIFICATES_BASE_URL:http://localhost:8080/api/attestation}

# CORS: comma-separated browser origins (add your Azure SWA / front-door HTTPS URL for production)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Rate limit (sliding window per minute per IP) for POST /api/auth/login|register|reset-password
app.rate-limit.auth-per-minute-per-ip=${APP_RATE_LIMIT_AUTH_PER_MINUTE:120}

# Freelance: optional startup ALTER TABLE (managed MySQL — leave false)
app.freelance.db-fixer.enabled=${APP_FREELANCE_DB_FIXER_ENABLED:false}

# ===== Outbound HTTP defaults (RestTemplate beans) =====
http.client.connect-timeout-ms=${HTTP_CLIENT_CONNECT_TIMEOUT_MS:5000}
http.client.read-timeout-ms=${HTTP_CLIENT_READ_TIMEOUT_MS:120000}

# ===== Actuator / metrics (paths also permitted in SecurityConfig) =====
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
# Mail is optional; the mail indicator fails without credentials and would mark health DOWN.
management.health.mail.enabled=false
