# Local development profile — activate with: spring.profiles.active=dev
# Do not put real production secrets here; use a local .env or IDE env vars.

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/jobmatch_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=CONVERT_TO_NULL}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

pusher.enabled=${PUSHER_ENABLED:false}

twilio.enabled=${TWILIO_ENABLED:false}

# Local: ONNX extract under JVM temp (override with APP_ONNX_TMPDIR if needed)
app.onnx.tmpdir=${APP_ONNX_TMPDIR:${java.io.tmpdir}/jobmatch-onnx-tmp}
