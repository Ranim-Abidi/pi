# Example AKS / Kubernetes manifests — tune namespace, image, resources, and ingress for your cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jobmatch-backend
  namespace: default
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jobmatch-backend-config
  namespace: default
data:
  SPRING_PROFILES_ACTIVE: "prod"
  APP_CORS_ALLOWED_ORIGINS: "https://your-frontend.example.com,http://localhost:4200"
  DB_URL: "jdbc:mysql://mysql.default.svc.cluster.local:3306/jobmatch_db?useSSL=false&serverTimezone=UTC"
  AI_GENERATOR_BASE_URL: "http://ml-question-generator.default.svc.cluster.local:8000"
  ML_SERVICE_URL: "http://ml-question-generator.default.svc.cluster.local:8000"
  FLASK_ML_URL: "http://flask-recommendation.default.svc.cluster.local:5000"
  FLASK_RECOMMENDATION_URL: "http://flask-recommendation.default.svc.cluster.local:5000/api/recommend"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobmatch-backend
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jobmatch-backend
  template:
    metadata:
      labels:
        app: jobmatch-backend
    spec:
      serviceAccountName: jobmatch-backend
      containers:
        - name: api
          image: your-registry/jobmatch-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: jobmatch-backend-config
          env:
            # Prefer CSI-mounted secrets for these in production:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jobmatch-backend-secrets
                  key: jwt-secret
                  optional: true
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jobmatch-backend-secrets
                  key: db-password
                  optional: true
            - name: ML_INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jobmatch-backend-secrets
                  key: ml-internal-api-key
                  optional: true
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: jobmatch-backend
  namespace: default
spec:
  selector:
    app: jobmatch-backend
  ports:
    - port: 8080
      targetPort: 8080
